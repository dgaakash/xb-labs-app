name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Decode and Verify Release Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret found. Will build debug APK."
            exit 0
          fi

          echo "Decoding keystore..."
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cp release.keystore app/release.keystore

          DECODED_SIZE=$(stat -c%s release.keystore)
          echo "Keystore decoded: $DECODED_SIZE bytes"

          echo "Verifying keystore..."
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12
          if [ $? -eq 0 ]; then
            echo "KEYSTORE_VALID=true" >> $GITHUB_ENV
            echo "Keystore is valid."
          else
            echo "Keystore verification FAILED. Will build debug APK."
            rm -f release.keystore app/release.keystore
          fi

      - name: Build APK
        run: |
          if [ "$KEYSTORE_VALID" = "true" ] && [ -f release.keystore ]; then
            echo "Building Signed Release APK..."
            KEYSTORE_FILE_PATH=release.keystore ./gradlew assembleRelease --stacktrace
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
